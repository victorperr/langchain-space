[project]
name = "langchain-space"
version = "0.1.0"
description = "LangChain Deep Agents sandbox backend for SPACE with snapshot-consistent time travel."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Victor" }]
dependencies = [
    "deepagents>=0.2",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "httpx>=0.27",
    "httpx-sse>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "langchain-tests>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_space"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["SPACE"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
exclude = ["^SPACE/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a running SPACE deployment (SPACE_API_URL etc.)",
    "consistency: rewind/fork correctness tests (the core claim)",
]
addopts = "-m 'not integration' --import-mode=importlib"
norecursedirs = ["SPACE", ".venv"]
