name: Integration (real SPACE)

# Brings up SPACE in a Kind cluster on a GitHub-hosted runner, following SPACE's
# docs/installation.md, then runs the integration tests and benchmarks against it.
# Manual only: a cold run compiles SPACE from source and can take a few hours.
# Credential-injection tests skip themselves (they need AWS Secrets Manager).

on:
  workflow_dispatch:
    inputs:
      space_ref:
        description: SPACE commit, tag or branch to install
        default: b6ca1b2a112759d69562e1a63488ccc62935fb0e
      template:
        description: Sandbox template the tests use
        type: choice
        options: [code-runtime, seed]
        default: code-runtime
      run_benchmarks:
        description: Run benchmarks/run.py --space after the tests
        type: boolean
        default: true
      benchmark_runs:
        description: Samples per latency benchmark
        default: "10"
      record_demo:
        description: Record examples/rewind_demo.py on real SPACE as a GIF
        type: boolean
        default: true

permissions:
  contents: read
  # Lets SPACE's scripts read its GHCR image mirror when that package is readable.
  packages: read

concurrency:
  group: integration-space
  cancel-in-progress: false

env:
  SPACE_KIND_CLUSTER: space-local
  SPACE_KIND_TELEMETRY_MODE: "off"
  # Builds take their base images from SPACE's GHCR mirror when readable, else from the source.
  SPACE_CI_IMAGE_MIRROR: ghcr
  SPACE_API_URL: http://127.0.0.1:8080
  SPACE_DATA_PLANE_URL: http://127.0.0.1:8090
  # On Kind, SPACE serves its E2B-compatible API (which serves forks) on the main API port
  # for Host 127.0.0.1: see ecwHosts in SPACE's infra/space/kind/charts/space-api-local/values.yaml.
  SPACE_ECW_API_URL: http://127.0.0.1:8080
  SPACE_TEMPLATE: ${{ inputs.template }}
  # API keys may not publish `seed` or `code-runtime` ("template name is reserved for operator
  # publication": ReservedTemplateNames in SPACE's internal/api/server/src/template_publication.rs),
  # so the code-runtime recipe is built under this name, in our org.
  CODE_RUNTIME_ALIAS: lcs-code-runtime
  # Seeded by SPACE's baseline migration (db/postgres/*_baseline.up.sql): the Local org and root@local.
  SPACE_LOCAL_ORG_ID: 00000000-0000-0000-0000-000000000001
  SPACE_ROOT_USER_ID: 00000000-0000-0000-0000-000000000010

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Check out SPACE
        uses: actions/checkout@v7
        with:
          repository: perplexityai/SPACE
          ref: ${{ inputs.space_ref }}
          path: SPACE
          persist-credentials: false

      - name: Record the machine
        id: machine
        run: |
          echo "space_sha=$(git -C SPACE rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          {
            echo "## Machine"
            echo
            echo "- Runner: \`${RUNNER_NAME}\` (${ImageOS:-unknown} ${ImageVersion:-})"
            echo "- CPU: $(lscpu | sed -n 's/^Model name: *//p') x $(nproc)"
            echo "- Memory: $(free -g | awk '/^Mem:/ {print $2}') GiB"
            echo "- SPACE: \`$(git -C SPACE rev-parse HEAD)\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker system prune -af >/dev/null
          # Kind nodes keep their containerd image stores here; /mnt is a separate disk.
          sudo install -d -m 0755 -o "$USER" -g "$(id -gn)" /mnt/kind-data
          echo "SPACE_KIND_DATA_ROOT=/mnt/kind-data" >>"$GITHUB_ENV"
          df -h / /mnt

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          for device in /dev/kvm /dev/net/tun; do
            [[ -c "$device" ]] || { echo "::error::The runner does not expose $device"; exit 1; }
          done
          [[ -r /dev/kvm && -w /dev/kvm ]] || { echo "::error::/dev/kvm is not read-writable"; exit 1; }

      - name: Install SPACE prerequisites
        working-directory: SPACE
        run: |
          sudo install -d -m 0755 -o "$USER" -g "$(id -gn)" /home/dev
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          INSTALL_DIR="$HOME/.local/bin" bash infra/space/kind/scripts/install-prereqs.sh

      # Anonymous public.ecr.aws pulls from GitHub runners hit "429 Too Many Requests: Data limit
      # exceeded". SPACE's own helper pulls each listed image from its GHCR mirror, else the same
      # digest from Docker Hub, and tags it with the name the Dockerfiles use, so builds find it
      # locally. See SPACE's ci/mirrored-images.txt.
      - name: Pre-pull SPACE's public.ecr.aws base images
        working-directory: SPACE
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          mapfile -t images < <(awk '!/^#/ && $1 ~ /^public\.ecr\.aws\// {print $1}' ci/mirrored-images.txt)
          bash ci/scripts/mirror-images.sh pull "${images[@]}"
          # Images with no Docker Hub twin in the list: take Docker Hub's official image of the
          # same name and tag (public.ecr.aws/ubuntu/ubuntu is Canonical's; so is Docker Hub's ubuntu).
          missing=0
          for image in "${images[@]}"; do
            image="${image%%@*}"  # the helper tags names pinned by digest without the digest
            docker image inspect "$image" >/dev/null 2>&1 && continue
            case "$image" in
              public.ecr.aws/ubuntu/ubuntu:*) fallback="docker.io/library/ubuntu:${image##*:}" ;;
              *) echo "::warning::No fallback for $image"; missing=1; continue ;;
            esac
            docker pull --quiet "$fallback" && docker tag "$fallback" "$image" \
              && echo "Took $image from $fallback" || missing=1
          done
          docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '^public\.ecr\.aws/' || true
          [[ "$missing" == 0 ]] || echo "::warning::Some public.ecr.aws images are not local; the build pulls them itself"

      # Compiling SPACE's Rust workspace is about 30 of the ~50 minutes bootstrap takes. Its output
      # is one image, keyed here by SPACE commit; SPACE's own CI hands it between jobs the same way
      # (SPACE_KIND_RUST_ARTIFACTS=prebuilt in infra/space/kind/scripts/build-rust-artifacts.sh).
      - name: Restore the compiled SPACE Rust image
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/space-rust-image.tar.zst
          key: space-rust-artifacts-${{ steps.machine.outputs.space_sha }}

      - name: Use the cached Rust image
        if: steps.rust-cache.outputs.cache-hit == 'true'
        env:
          SPACE_SHA: ${{ steps.machine.outputs.space_sha }}
        run: |
          zstd -dcq "$RUNNER_TEMP/space-rust-image.tar.zst" | docker load
          rm -f "$RUNNER_TEMP/space-rust-image.tar.zst"
          {
            echo "SPACE_KIND_RUST_ARTIFACTS=prebuilt"
            echo "SPACE_KIND_PREBUILT_RUST_IMAGE_ID=$(docker image inspect -f '{{.Id}}' space-rust-build-kind:local)"
            echo "SPACE_KIND_PREBUILT_RUST_SHA=$SPACE_SHA"
          } >>"$GITHUB_ENV"

      - name: Build and deploy SPACE
        id: deploy
        working-directory: SPACE
        run: |
          export SPACE_VENDOR_ROOT="$HOME/.local/share/space/vendor"
          # Pods pull their images inside the Kind nodes, which cannot see the images pulled above.
          # bootstrap.sh creates the cluster long before it installs the charts, so copy each local
          # public.ecr.aws image a chart names into the nodes as soon as they exist (the charts use
          # pullPolicy IfNotPresent, so no pod then asks public.ecr.aws for it).
          (
            for _ in $(seq 1 360); do
              if [[ -n "$(kind get nodes --name "$SPACE_KIND_CLUSTER" 2>/dev/null)" ]]; then
                sleep 30
                docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '^public\.ecr\.aws/' |
                  while read -r image; do
                    grep -rqF "${image%:*}" infra/space/kind/charts || continue
                    kind load docker-image "$image" --name "$SPACE_KIND_CLUSTER" \
                      && echo "[preload] loaded $image into the Kind nodes"
                  done
                exit 0
              fi
              sleep 10
            done
          ) &
          preload=$!
          time bash infra/space/kind/scripts/install-fc-vendor.sh
          time bash infra/space/kind/scripts/bootstrap.sh
          kill "$preload" 2>/dev/null || true

      # Saved even when a later part of bootstrap fails, as long as the compile finished.
      - name: Export the compiled SPACE Rust image
        id: rust-export
        if: ${{ !cancelled() && steps.rust-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |
          if docker image inspect space-rust-build-kind:local >/dev/null 2>&1; then
            docker save space-rust-build-kind:local | zstd -T0 -3 -q -o "$RUNNER_TEMP/space-rust-image.tar.zst"
            ls -lh "$RUNNER_TEMP/space-rust-image.tar.zst"
            echo "ready=true" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::No compiled Rust image to cache"
          fi

      - name: Save the compiled SPACE Rust image for later runs
        if: ${{ !cancelled() && steps.rust-export.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/space-rust-image.tar.zst
          key: space-rust-artifacts-${{ steps.machine.outputs.space_sha }}

      - name: Wait for the seed template and node services
        working-directory: SPACE
        run: |
          kubectl --context kind-space-local -n space get pods
          kubectl --context kind-space-local -n space \
            wait --for=condition=complete job/space-seed-publish --timeout=600s
          for ds in $(bash infra/space/kind/lib/node-services.sh daemonsets); do
            kubectl --context kind-space-local -n space rollout status "ds/$ds" --timeout=600s
          done
          curl -fsS --max-time 15 "$SPACE_API_URL/openapi-m1.json" | jq -e '.openapi and .paths' >/dev/null
          for _ in $(seq 1 150); do
            curl -sf -m 2 "$SPACE_DATA_PLANE_URL/healthz" >/dev/null && exit 0
            sleep 2
          done
          echo "::error::The data plane never became healthy"
          exit 1

      # The next two steps may fail without skipping the tests: fork tests skip themselves without
      # SPACE_ECW_API_KEY, and the template falls back to seed. "Fail if a setup step failed" below
      # still marks the run failed, after the tests have run.
      - name: Create an API key for the fork API
        id: ecw
        continue-on-error: true
        working-directory: SPACE
        run: |
          key="lcs_ci_$(openssl rand -hex 32)"
          echo "::add-mask::$key"
          key_file="$RUNNER_TEMP/ecw-key"
          (umask 077 && printf '%s' "$key" >"$key_file")
          # Same organization as root@local, so forked sandboxes are visible to the native API.
          # seed-api-key.sh only prints the SQL here: its --execute helper pod asks for a
          # `general` node pool that Kind does not have. Run the SQL inside the Postgres pod
          # instead, as SPACE's Kind suites do (kind_stack_psql, scripts/tests/lib/bootstrap-kind-stack.sh).
          sql="$(bash scripts/seed-api-key.sh \
            --org-id "$SPACE_LOCAL_ORG_ID" --created-by "$SPACE_ROOT_USER_ID" \
            --name langchain-space-ci --token-file "$key_file" \
            | sed -n '/^INSERT INTO api_keys/,/^);/p')"
          [[ -n "$sql" ]] || { echo "::error::seed-api-key.sh printed no INSERT"; exit 1; }
          kctl() { kubectl --context "kind-$SPACE_KIND_CLUSTER" -n space "$@"; }
          # The template prints no trailing newline, and `read` from `< <(...)` then returns 1,
          # which `bash -e` turned into a silent exit. A here-string adds the newline.
          creds="$(kctl get secret space-postgres -o \
            go-template='{{index .data "POSTGRES_USER" | base64decode}} {{index .data "POSTGRES_DB" | base64decode}}')" \
            || { echo "::error::Could not read the space-postgres secret"; exit 1; }
          read -r pg_user pg_db <<<"$creds"
          [[ -n "$pg_user" && -n "$pg_db" ]] || { echo "::error::space-postgres secret lacks POSTGRES_USER/POSTGRES_DB"; exit 1; }
          printf '%s\n' "$sql" | kctl exec -i sts/space-postgres -- \
            env PGHOST=127.0.0.1 PGSSLMODE=require \
            psql -U "$pg_user" -d "$pg_db" -tA -v ON_ERROR_STOP=1 \
            || { echo "::error::Inserting the API key row failed"; exit 1; }
          code="$(printf 'header = "x-api-key: %s"\n' "$key" \
            | curl -s -o /dev/null -w '%{http_code}' --config - "$SPACE_ECW_API_URL/sandboxes")"
          echo "E2B-compatible GET /sandboxes -> HTTP $code"
          [[ "$code" == 200 ]] || { echo "::error::The fork API did not accept the key"; exit 1; }
          # Only a key the fork API accepted reaches the tests.
          echo "SPACE_ECW_API_KEY=$key" >>"$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.11"

      - name: Build the code-runtime template
        id: template
        if: inputs.template == 'code-runtime' && steps.ecw.outcome == 'success'
        continue-on-error: true
        working-directory: SPACE
        timeout-minutes: 120
        run: |
          export E2B_API_KEY="$SPACE_ECW_API_KEY"
          uv run --script scripts/build-code-runtime.py --alias "$CODE_RUNTIME_ALIAS" \
            --domain local.e2b.test --api-url "$SPACE_ECW_API_URL" --skip-sandbox-check
          echo "SPACE_TEMPLATE=$CODE_RUNTIME_ALIAS" >>"$GITHUB_ENV"

      - name: Fall back to the seed template
        if: inputs.template == 'code-runtime' && steps.template.outcome != 'success'
        run: |
          echo "::warning::code-runtime was not built; testing with seed, which may lack python"
          echo "SPACE_TEMPLATE=seed" >>"$GITHUB_ENV"

      - name: Install langchain-space
        run: uv sync --locked

      - name: Log in to SPACE
        run: &login |
          token="$(curl -fsS --max-time 15 -X POST "$SPACE_API_URL/auth/v1/sessions" \
            -H 'content-type: application/json' \
            -d '{"email":"root@local","password":"password"}' | jq -er '.token')"
          echo "::add-mask::$token"
          echo "SPACE_API_TOKEN=$token" >>"$GITHUB_ENV"

      - name: Run integration tests
        id: tests
        run: |
          uv run pytest -m integration tests/integration -v -rs \
            --junitxml=integration-results.xml

      - name: Log in to SPACE again
        if: ${{ !cancelled() && inputs.run_benchmarks && steps.tests.outcome != 'skipped' }}
        run: *login

      - name: Run benchmarks
        if: ${{ !cancelled() && inputs.run_benchmarks && steps.tests.outcome != 'skipped' }}
        env:
          BENCHMARK_RUNS: ${{ inputs.benchmark_runs }}
        run: |
          uv run python benchmarks/run.py --space --template "$SPACE_TEMPLATE" \
            --runs "$BENCHMARK_RUNS" | tee benchmark-table.md
          { echo "## Benchmarks"; echo; cat benchmark-table.md; } >>"$GITHUB_STEP_SUMMARY"

      # The demo is a bonus: neither of its steps can fail the run.
      - name: Log in to SPACE for the demo
        if: ${{ !cancelled() && inputs.record_demo && steps.tests.outcome != 'skipped' }}
        continue-on-error: true
        run: *login

      # The README GIF. Real SPACE steps take seconds each; agg caps every pause at 1 s, so the
      # GIF stays short while the printed timings still show the real durations.
      - name: Record the rewind demo on real SPACE
        if: ${{ !cancelled() && inputs.record_demo && steps.tests.outcome != 'skipped' }}
        continue-on-error: true
        env:
          AGG_VERSION: v1.9.0
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq asciinema >/dev/null
          curl -fsSL -o "$RUNNER_TEMP/agg" \
            "https://github.com/asciinema/agg/releases/download/$AGG_VERSION/agg-x86_64-unknown-linux-gnu"
          chmod +x "$RUNNER_TEMP/agg"
          export TERM=xterm-256color
          # `script` gives asciinema the terminal a CI step lacks.
          script -q -e -c "asciinema rec --overwrite --cols 88 --rows 24 \
            -c 'uv run python examples/rewind_demo.py --space --template $SPACE_TEMPLATE' \
            rewind-demo.cast" /dev/null
          "$RUNNER_TEMP/agg" --idle-time-limit 1 --font-size 18 rewind-demo.cast rewind-demo.gif
          ls -lh rewind-demo.cast rewind-demo.gif

      - name: Fail if a setup step failed
        if: ${{ !cancelled() && (steps.ecw.outcome == 'failure' || steps.template.outcome == 'failure') }}
        run: |
          echo "::error::Setup did not fully succeed (fork API key: ${{ steps.ecw.outcome }}, code-runtime: ${{ steps.template.outcome }})"
          exit 1

      - name: Collect SPACE diagnostics
        if: failure()
        timeout-minutes: 5
        run: |
          dir="$RUNNER_TEMP/space-diagnostics"
          mkdir -p "$dir"
          k() { timeout "$1" kubectl --context kind-space-local "${@:2}"; }
          k 30s get pods -A -o wide >"$dir/pods.txt" 2>&1 || true
          k 30s get events -A --sort-by=.lastTimestamp >"$dir/events.txt" 2>&1 || true
          for pod in $(k 30s -n space get pods -o name 2>/dev/null); do
            k 45s -n space logs "$pod" --all-containers --prefix --tail=300 \
              >"$dir/${pod#pod/}.log" 2>&1 || true
          done
          df -h >"$dir/df.txt"; free -m >"$dir/free.txt"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results
          path: |
            integration-results.xml
            benchmark-table.md
            benchmarks/results/
            rewind-demo.cast
            rewind-demo.gif
            ${{ runner.temp }}/space-diagnostics/
          if-no-files-found: ignore
          retention-days: 30
